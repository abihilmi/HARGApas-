name: Build APK Umum

# Cara pakai: upload 1 file HTML ke halaman utama repo (nama bebas, mis. index.html).
# Opsional: pengaturan.txt, folder icons (gambar PNG), debug.keystore.
# Build jalan otomatis setiap ada perubahan di repo. APK ada di tab Actions > Artifacts.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil file dari repository
        uses: actions/checkout@v4

      - name: Pasang Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Baca file HTML, nama aplikasi, dan pengaturan
        run: |
          # 1. Cari file HTML (index.html dulu, kalau tidak ada pakai .html pertama di halaman utama)
          if [ -f index.html ]; then HTML_FILE="index.html"
          else HTML_FILE=$(ls *.html 2>/dev/null | head -n 1)
          fi
          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: Tidak ada file .html di halaman utama repo. Upload file HTML dulu."
            exit 1
          fi

          # 2. Baca pengaturan.txt (jika ada)
          getcfg() { [ -f pengaturan.txt ] && grep -i "^$1=" pengaturan.txt | head -n 1 | cut -d= -f2- | tr -d '\r' | sed 's/^ *//;s/ *$//'; }
          NAME=$(getcfg nama || true)
          WANT_LOC=$(getcfg lokasi || true)
          WANT_DREAM=$(getcfg screensaver || true)

          # 3. Nama aplikasi: dari pengaturan.txt, kalau kosong pakai nama file HTML (atau nama repo untuk index.html)
          if [ -z "$NAME" ]; then
            BASE="${HTML_FILE%.html}"
            if [ "$BASE" = "index" ]; then BASE="${GITHUB_REPOSITORY#*/}"; fi
            NAME="$BASE"
          fi
          NAME=$(printf '%s' "$NAME" | tr -cd 'A-Za-z0-9 ._-')
          if [ -z "$NAME" ]; then NAME="Aplikasi"; fi

          # 4. Nama paket otomatis: com.<pemilik repo>.<nama aplikasi>
          SLUG=$(printf '%s' "$NAME" | tr 'A-Z' 'a-z' | tr -cd 'a-z0-9')
          if [ -z "$SLUG" ]; then SLUG="app"; fi
          case "$SLUG" in [0-9]*) SLUG="a$SLUG";; esac
          OWNER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z' | tr -cd 'a-z0-9')
          if [ -z "$OWNER" ]; then OWNER="app"; fi
          case "$OWNER" in [0-9]*) OWNER="a$OWNER";; esac
          PKG="com.$OWNER.$SLUG"

          # 5. Icon: folder icons dulu, lalu halaman utama
          ICON_FILE=""
          if [ -f icons/icon.png ]; then ICON_FILE="icons/icon.png"
          elif ls icons/*.png >/dev/null 2>&1; then ICON_FILE=$(ls icons/*.png | head -n 1)
          elif [ -f icon.png ]; then ICON_FILE="icon.png"
          elif ls *.png >/dev/null 2>&1; then ICON_FILE=$(ls *.png | head -n 1)
          fi

          LOWER_LOC=$(printf '%s' "$WANT_LOC" | tr 'A-Z' 'a-z')
          LOWER_DREAM=$(printf '%s' "$WANT_DREAM" | tr 'A-Z' 'a-z')

          {
            echo "HTML_FILE=$HTML_FILE"
            echo "APP_NAME=$NAME"
            echo "SLUG=$SLUG"
            echo "PKG=$PKG"
            echo "ICON_FILE=$ICON_FILE"
            echo "WANT_LOC=$LOWER_LOC"
            echo "WANT_DREAM=$LOWER_DREAM"
          } >> "$GITHUB_ENV"

          echo "File HTML     : $HTML_FILE"
          echo "Nama aplikasi : $NAME"
          echo "Nama paket    : $PKG"
          echo "Icon          : ${ICON_FILE:-(bawaan)}"
          echo "Izin lokasi   : ${LOWER_LOC:-tidak}"
          echo "Screensaver   : ${LOWER_DREAM:-tidak}"

      - name: Siapkan proyek Android
        run: |
          mkdir -p www
          cp "$HTML_FILE" www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6
          npx cap init "$APP_NAME" "$PKG" --web-dir=www
          npx cap add android
          if [ "$WANT_LOC" = "ya" ]; then
            sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <application#' android/app/src/main/AndroidManifest.xml
          fi
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Tambahkan fitur simpan PDF ke folder Download (jika HTML memakai AndroidSaver)
        run: |
          grep -q 'AndroidSaver' www/index.html || { echo "HTML tidak memakai AndroidSaver, langkah ini dilewati."; exit 0; }
          PKG_DIR="android/app/src/main/java/$(echo "$PKG" | tr . /)"
          echo '' | base64 -d > "$PKG_DIR/MainActivity.java"
          echo '' | base64 -d > "$PKG_DIR/FileSaver.java"
          sed -i "s/__PKG__/$PKG/" "$PKG_DIR/MainActivity.java" "$PKG_DIR/FileSaver.java"
          sed -i 's#<application#<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Agar aplikasi jalan tanpa internet (Tailwind, FontAwesome, Google Fonts)
        continue-on-error: true
        run: |
          grep -qiE 'cdn\.tailwindcss\.com|font-awesome|fonts\.googleapis\.com' www/index.html || { echo "Tidak ada sumber dari internet di HTML, langkah ini dilewati."; exit 0; }
          mkdir -p /tmp/off
          cd /tmp/off
          npm init -y > /dev/null
          npm install tailwindcss@3.4.17 @fortawesome/fontawesome-free@6 @fontsource/inter@5
          cd "$GITHUB_WORKSPACE"
          echo '' | base64 -d > /tmp/offline.js
          node /tmp/offline.js

      - name: Tambahkan screensaver (jika screensaver=ya)
        if: env.WANT_DREAM == 'ya'
        run: |
          PKG_DIR="android/app/src/main/java/$(echo "$PKG" | tr . /)"
          mkdir -p "$PKG_DIR" android/app/src/main/res/xml
          echo '' | base64 -d > "$PKG_DIR/AppDream.java"
          sed -i "s/__PKG__/$PKG/" "$PKG_DIR/AppDream.java"
          echo 'PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPGRyZWFtIHhtbG5zOmFuZHJvaWQ9Imh0dHA6Ly9zY2hlbWFzLmFuZHJvaWQuY29tL2Fway9yZXMvYW5kcm9pZCIgLz4K' | base64 -d > android/app/src/main/res/xml/app_dream.xml
          echo '' | base64 -d > /tmp/add_service.py
          python3 /tmp/add_service.py
          printf '\ndependencies {\n    implementation "androidx.webkit:webkit:1.9.0"\n}\n' >> android/app/build.gradle

      - name: Sinkronkan file web ke Android
        run: npx cap sync android

      - name: Pasang icon (jika ada gambar PNG)
        run: |
          if [ -n "$ICON_FILE" ]; then
            echo "Memakai icon: $ICON_FILE"
            mkdir -p assets
            npm install @capacitor/assets@3 sharp
            node -e "require('sharp')(process.argv[1]).resize(1024,1024,{fit:'contain',background:{r:255,g:255,b:255,alpha:0}}).png().toFile('assets/icon.png').then(()=>console.log('Icon diperbesar ke 1024x1024'))" "$ICON_FILE"
            npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff'
          else
            echo "Icon tidak ditemukan, memakai icon bawaan"
          fi

      - name: Pakai kunci tanda tangan tetap (jika ada debug.keystore)
        run: |
          if [ -f debug.keystore ]; then
            mkdir -p ~/.android
            cp debug.keystore ~/.android/debug.keystore
            echo "Memakai debug.keystore dari repo (APK bisa menimpa versi lama)"
          else
            echo "debug.keystore tidak ada; hapus aplikasi lama sebelum instal versi baru"
          fi

      - name: Izinkan akses WhatsApp dan WA Business
        run: |
          sed -i 's#<application#<queries>\n        <package android:name="com.whatsapp" />\n        <package android:name="com.whatsapp.w4b" />\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="whatsapp" />\n        </intent>\n    </queries>\n    <application#' android/app/src/main/AndroidManifest.xml
      
      - name: Bangun APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/${SLUG}.apk"

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SLUG }}-apk
          path: android/app/build/outputs/apk/debug/${{ env.SLUG }}.apk

      - name: Buat Release (APK bisa diunduh dari halaman Releases)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "v1.${{ github.run_number }}" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create "v1.${{ github.run_number }}" "android/app/build/outputs/apk/debug/${SLUG}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${APP_NAME} v1.${{ github.run_number }}" \
            --notes "APK ${APP_NAME} hasil build otomatis nomor ${{ github.run_number }}."
