const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:d(S),iterations:N,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:d(I)},key,d(C));
  return new TextDecoder().decode(buf);
}
async function run(pw,save){
  const e=document.getElementById("err");e.textContent="Memeriksa...";
  try{
    const html=await open_(pw);
    if(save){try{localStorage.setItem(K,pw)}catch(_){}}
    document.open();document.write(html);document.close();
  }catch(_){
    e.textContent="Password salah.";
    try{localStorage.removeItem(K)}catch(_){}
  }
}
