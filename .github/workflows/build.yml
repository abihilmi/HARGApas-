name: Build Android APK (HARGAPAS)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Cordova CLI
      run: npm install -g cordova

    - name: Create Cordova Project
      run: |
        cordova create hargapas_app com.ahcreativa.hargapas HargaPas
        cd hargapas_app
        cordova platform add android@12.0.0

    - name: Configure Cordova Plugins
      run: |
        cd hargapas_app
        # Menambahkan plugin printer agar fungsi window.plugins.printer aktif di APK
        cordova plugin add cordova-plugin-printer
        # Menambahkan plugin file untuk izin sistem penyimpanan lokal internal
        cordova plugin add cordova-plugin-file

    - name: Inject HTML Calculator & Icon Configuration
      run: |
        # Mengosongkan folder default bawaan Cordova www
        rm -rf hargapas_app/www/*
        
        # Salin seluruh isi file kode sumber web dari root repositori ke folder aset Cordova
        cp -r * hargapas_app/www/ 2>/dev/null || true
        
        # Pindahkan file ikon HARGAPAS.png ke folder resource Cordova jika disediakan oleh user
        if [ -f "HARGAPAS.png" ]; then
          mkdir -p hargapas_app/res/icon/android
          cp HARGAPAS.png hargapas_app/res/icon/android/icon.png
          
          # Menyisipkan konfigurasi XML tag icon aplikasi utama di config.xml
          sed -i '/<\/widget>/i \    <platform name="android">
        <icon src="res/icon/android/icon.png" />
    <\/platform>' hargapas_app/config.xml
        fi

    - name: Build Android APK (Debug Mode)
      run: |
        cd hargapas_app
        cordova build android --debug

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HARGAPAS-Calculator-APK
        path: hargapas_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
